<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b14"/>
      <stop offset="50%" stop-color="#051424"/>
      <stop offset="100%" stop-color="#0b253e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#006699" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Glowing Soundwaves & Neural Nodes Motif -->
  <g filter="url(#glow)">
    <!-- Central Soundwave Bars -->
    <rect x="146" y="216" width="20" height="80" rx="10" fill="url(#cyanGrad)"/>
    <rect x="186" y="176" width="20" height="160" rx="10" fill="url(#cyanGrad)"/>
    <rect x="226" y="136" width="20" height="240" rx="10" fill="url(#cyanGrad)"/>
    <rect x="266" y="136" width="20" height="240" rx="10" fill="url(#cyanGrad)"/>
    <rect x="306" y="176" width="20" height="160" rx="10" fill="url(#cyanGrad)"/>
    <rect x="346" y="216" width="20" height="80" rx="10" fill="url(#cyanGrad)"/>
  </g>

  <!-- Orbiting Neural Nodes / Sparkles -->
  <circle cx="256" cy="100" r="14" fill="#00F2FE"/>
  <circle cx="116" cy="256" r="10" fill="#4FACFE"/>
  <circle cx="396" cy="256" r="10" fill="#4FACFE"/>
  <circle cx="256" cy="412" r="12" fill="#00F2FE"/>

  <!-- Brand Subtitle / Monogram -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#80e9ff" letter-spacing="4">OFG.AI STUDIO</text>
</svg>
